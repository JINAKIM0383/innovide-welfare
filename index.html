<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이노바이드 복지 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#534AB7;--pb:#EEEDFE;--bg:#fff;--bg2:#f8f8f7;--bg3:#f1efe8;--tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--bd:#e8e8e4;--bd2:#d3d1c7;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;font-size:14px;color:var(--tx);background:var(--bg3)}
.layout{display:flex;height:100vh;overflow:hidden}
.sb{width:192px;background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:16px;border-bottom:1px solid var(--bd)}
.sb-name{font-size:13px;font-weight:600}
.sb-email{font-size:11px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-nav{padding:6px 0;flex:1;overflow-y:auto}
.ni{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:var(--tx2);cursor:pointer;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:var(--bg2)}
.ni.active{background:var(--pb);color:var(--p);font-weight:500}
.ni i{font-size:16px;flex-shrink:0}
.sb-bot{padding:10px 14px;border-top:1px solid var(--bd)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:48px;padding:0 24px;border-bottom:1px solid var(--bd);background:var(--bg);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:600}
.content{padding:20px 24px;flex:1;overflow-y:auto}
.screen{display:none}.screen.on{display:block}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:500px}
.login-box{width:380px;text-align:center}
.login-icon{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--tx2)}
.login-title{font-size:18px;font-weight:600;margin-bottom:28px}
.lf{margin-bottom:16px;text-align:left}
.ll{font-size:12px;color:var(--tx2);margin-bottom:5px;display:block}
.li{width:100%;border:none;border-bottom:1.5px solid var(--bd2);padding:8px 0;font-size:14px;background:transparent;color:var(--tx);outline:none}
.li:focus{border-bottom-color:var(--p)}
.btn-login{width:100%;height:46px;background:var(--p);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;margin-top:24px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fr{margin-bottom:10px}
.fl{font-size:12px;color:var(--tx2);margin-bottom:4px;display:block}
.fi{width:100%;height:38px;padding:0 12px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;color:var(--tx);background:var(--bg);outline:none}
.fi:focus{border-color:var(--p)}
.fs{width:100%;height:38px;padding:0 12px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;color:var(--tx);background:var(--bg)}
.fta{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;color:var(--tx);background:var(--bg);resize:vertical;min-height:72px;outline:none;font-family:inherit}
.fta:focus{border-color:var(--p)}
.bbar{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.btn{height:34px;padding:0 16px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;border:1px solid var(--bd2);background:var(--bg);color:var(--tx2)}
.btn:hover{background:var(--bg2)}
.btn-p{height:34px;padding:0 16px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;background:var(--p);color:#fff;border:none}
.btn-p:hover{background:#3C3489}
.btn-sm{height:26px;padding:0 9px;font-size:12px;border-radius:var(--r);cursor:pointer;border:1px solid var(--bd2);background:var(--bg);color:var(--tx2);font-weight:500}
.bok{background:#EAF3DE;color:#3B6D11;border-color:#C0DD97}
.bng{background:#FCEBEB;color:#A32D2D;border-color:#F7C1C1}
.bpt{background:#EEEDFE;color:#534AB7;border-color:#AFA9EC}
.msg{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.msg-ok{background:#EAF3DE;color:#3B6D11}
.msg-err{background:#FCEBEB;color:#A32D2D}
.split-box{background:#E6F1FB;border:1px solid #85B7EB;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13px;color:#185FA5}
.ib{border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;background:var(--bg2)}
.add-btn{width:100%;height:36px;border:1.5px dashed var(--bd2);border-radius:var(--r);background:none;cursor:pointer;font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
.add-btn:hover{border-color:var(--p);color:var(--p);background:var(--pb)}
.tbar{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.upload-zone{border:1.5px dashed var(--bd2);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;background:var(--bg2)}
.upload-zone:hover{border-color:var(--p)}
.prev-img{max-width:100%;max-height:120px;border-radius:var(--r);margin-top:8px;border:1px solid var(--bd)}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;vertical-align:middle}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.met{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.met-l{font-size:11px;color:var(--tx2);font-weight:600;margin-bottom:4px}
.met-v{font-size:22px;font-weight:700}
.frow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.frow select,.frow input{height:32px;font-size:13px;padding:0 10px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--tx)}
.frow input{flex:1;min-width:120px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd);background:var(--bg2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.dr{cursor:pointer}
.tbl tr.dr:hover td{background:#fafaf9}
.tbl tr.dr.exp td{background:var(--pb)}
.det-row td{padding:0;background:var(--bg2)!important;border-bottom:1px solid var(--bd)}
.det{padding:16px 20px}
.det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.det-f{display:flex;flex-direction:column;gap:3px}
.det-l{font-size:11px;color:var(--tx3);font-weight:600}
.det-v{font-size:13px;color:var(--tx)}
.ib-det{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;background:var(--bg);margin-bottom:8px}
.ib-det:last-child{margin-bottom:0}
.det-act{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--r);font-size:11px;font-weight:600}
.bw{background:#FAEEDA;color:#854F0B}
.bo{background:#EAF3DE;color:#3B6D11}
.bn{background:#FCEBEB;color:#A32D2D}
.bp{background:#EEEDFE;color:#534AB7}
.pbar{height:5px;background:var(--bd);border-radius:3px;margin-top:4px}
.pfill{height:100%;border-radius:3px}
.cath{background:#E1F5EE;color:#0F6E56;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.catg{background:#EEEDFE;color:#534AB7;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.cate{background:#FAEEDA;color:#854F0B;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);justify-content:space-between}
.user-info-box{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pb);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--p);flex-shrink:0}
.hint{font-size:11px;color:var(--tx3)}
.empty{text-align:center;padding:28px;font-size:13px;color:var(--tx3)}
.chev{transition:transform .2s;font-size:14px;color:var(--tx3)}
.exp .chev{transform:rotate(180deg)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal-box{background:var(--bg);border-radius:12px;padding:16px;max-width:90vw;max-height:88vh;overflow:auto}
.modal-box img{max-width:75vw;max-height:70vh;display:block;border-radius:var(--r)}
</style>
</head>
<body>
<div class="layout">
<div class="sb">
  <div class="sb-top">
    <div class="sb-name" id="sbName">이노바이드</div>
    <div class="sb-email" id="sbEmail">복지 시스템</div>
  </div>
  <nav class="sb-nav">
    <button class="ni" id="sn-apply" onclick="go('apply')"><i class="ti ti-gift"></i>복지 신청</button>
    <button class="ni" id="sn-mine" onclick="go('mine')"><i class="ti ti-list-check"></i>내 현황</button>
    <button class="ni" id="sn-saas" onclick="go('saas')"><i class="ti ti-brand-appstore"></i>SaaS 신청</button>
    <button class="ni" id="sn-myinfo" onclick="go('myinfo')"><i class="ti ti-user-circle"></i>내 정보</button>
    <button class="ni" id="sn-users" onclick="go('users')"><i class="ti ti-users"></i>구성원 관리</button>
  </nav>
  <div class="sb-bot">
    <button class="ni" id="sn-out" onclick="doOut()" style="padding:0;color:var(--tx3)"><i class="ti ti-logout"></i>로그아웃</button>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="pgTitle">이노바이드 복지 시스템</span>
    <span style="font-size:12px;color:var(--tx3)" id="topUser"></span>
  </div>
  <div class="content">

    <div id="sc-login" class="screen on">
      <div class="login-wrap"><div class="login-box">
        <div class="login-icon"><i class="ti ti-user" style="font-size:24px"></i></div>
        <div class="login-title">이노바이드 복지 시스템</div>
        <div id="lmsg" style="color:red;font-size:12px;margin-bottom:10px"></div>
        <div class="lf"><label class="ll">이메일</label><input class="li" id="le" type="email" placeholder="회사 이메일 입력"></div>
        <div class="lf"><label class="ll">비밀번호</label><input class="li" id="lp" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn-login" onclick="doLogin()">로그인</button>
        <p class="hint" style="margin-top:14px">계정이 없으면 People팀에 문의하세요</p>
      </div></div>
    </div>

    <div id="sc-users" class="screen">
      <div class="card">
        <div class="card-title">구성원 등록</div>
        <div id="umsg" style="color:green;font-size:12px;margin-bottom:10px"></div>
        <div class="g2" style="margin-bottom:10px">
          <div class="fr"><label class="fl">이름</label><input class="fi" id="un" placeholder="홍길동"></div>
          <div class="fr"><label class="fl">이메일</label><input class="fi" id="ue" type="email" placeholder="example@dentlink.app"></div>
        </div>
        <div class="g2" style="margin-bottom:10px">
          <div class="fr"><label class="fl">부서</label><input class="fi" id="ud" placeholder="개발팀"></div>
          <div class="fr"><label class="fl">임시 비밀번호</label><input class="fi" id="upw" placeholder="비밀번호 입력"></div>
        </div>
        <p class="hint" style="margin-bottom:10px">등록 후 이메일과 비밀번호를 구성원에게 전달해주세요.</p>
        <button class="btn-p" onclick="addUserFromUI()"><i class="ti ti-plus"></i> 등록</button>
      </div>
      <div class="card" style="padding:20px">
        <div class="card-title">구성원 목록</div>
        <div id="ulist"></div>
      </div>
    </div>

    <div id="sc-apply" class="screen"><div class="card"><div class="card-title">복지 신청 페이지 준비됨</div></div></div>
    <div id="sc-mine" class="screen"><div class="card"><div class="card-title">내 현황 페이지 준비됨</div></div></div>
    <div id="sc-saas" class="screen"><div class="card"><div class="card-title">SaaS 신청 페이지 준비됨</div></div></div>
    <div id="sc-myinfo" class="screen"><div class="card"><div class="card-title">내 정보 변경 준비됨</div></div></div>

  </div>
</div>
</div>

<script>
// --- [데이터 관리 및 초기화 엔진] ---
const DEFAULT_ADMIN = { id: 'u1', name: 'People팀', email: 'people@dentlink.app', dept: 'People팀', pw: 'admin1234', role: 'admin' };

function loadSystemData() {
  try {
    const localData = localStorage.getItem('inno_welfare_data');
    if (localData) {
      const parsed = JSON.parse(localData);
      if (parsed && parsed.users && parsed.users.length > 0) {
        return parsed;
      }
    }
  } catch(e) {}
  
  // 초기 데이터가 아예 없는 경우 기본값 세팅
  return {
    users: [DEFAULT_ADMIN],
    requests: [],
    saas: [],
    saasReqs: [],
    period: { half: '2026년 1반기', quarter: '2026년 2분기', qdate: '' }
  };
}

// 최초 데이터 로드
let d = loadSystemData();

function S(data) {
  d = data;
  localStorage.setItem('inno_welfare_data', JSON.stringify(d));
}

// --- [화면 전환 시스템 (go)] ---
function go(screenId) {
  const screens = document.querySelectorAll('.screen');
  screens.forEach(s => s.classList.remove('on'));
  
  const targetScreen = document.getElementById('sc-' + screenId);
  if(targetScreen) targetScreen.classList.add('on');
  
  const navButtons = document.querySelectorAll('.ni');
  navButtons.forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('sn-' + screenId);
  if(activeBtn) activeBtn.classList.add('active');
  
  const pgTitle = document.getElementById('pgTitle');
  if(screenId === 'users') pgTitle.innerText = '구성원 관리';
  if(screenId === 'apply') pgTitle.innerText = '복지 신청';
  if(screenId === 'mine') pgTitle.innerText = '내 현황';
  if(screenId === 'saas') pgTitle.innerText = 'SaaS 신청';
  if(screenId === 'myinfo') pgTitle.innerText = '내 정보';
}

// 어드민 전용 탭 전환 호환 함수
function aTab(tabId) {
  if(tabId === 'users') go('users');
}

// --- [로그인 엔진] ---
function doLogin() {
  const email = document.getElementById('le').value.trim();
  const password = document.getElementById('lp').value;
  const lmsg = document.getElementById('lmsg');
  
  const user = d.users.find(u => u.email === email && u.pw === password);
  
  if (user) {
    lmsg.innerText = '';
    document.getElementById('topUser').innerText = `${user.name} (${user.dept})`;
    go('users'); // 로그인 성공 시 구성원 관리로 바로 이동
  } else {
    lmsg.innerText = '이메일 또는 비밀번호가 올바르지 않습니다.';
  }
}

function doOut() {
  document.getElementById('le').value = '';
  document.getElementById('lp').value = '';
  document.getElementById('topUser').innerText = '';
  go('login');
}

// --- [구성원 자동 동적 추가 엔진] ---
function addUserFromUI() {
  const nameInput = document.getElementById('un').value.trim();
  const emailInput = document.getElementById('ue').value.trim();
  const deptInput = document.getElementById('ud').value.trim() || '구성원';
  const pwInput = document.getElementById('upw').value;
  const umsg = document.getElementById('umsg');

  if (!nameInput || !emailInput || !pwInput) {
    alert('이름, 이메일, 임시 비밀번호는 필수 입력사항입니다!');
    return;
  }

  // 이메일 중복 체크
  if (d.users.some(u => u.email === emailInput)) {
    alert('이미 등록된 이메일 주소입니다.');
    return;
  }

  // 동적 ID 생성 (u2, u3, u4...)
  const nextId = 'u' + (d.users.length + 1);

  const newUser = {
    id: nextId,
    name: nameInput,
    email: emailInput,
    dept: deptInput,
    pw: pwInput,
    role: 'user' // 가입하는 직원은 일반 구성원 등급 부여
  };

  // 기존 명단 뒤에 자동으로 붙이기
  d.users.push(newUser);
  S(d); // 데이터 브라우저에 즉시 세이브

  umsg.innerText = `🎉 명단 등록 완료: ${nameInput}님이 추가되었습니다.`;
  
  // 입력창 지워주기
  document.getElementById('un').value = '';
  document.getElementById('ue').value = '';
  document.getElementById('ud').value = '';
  document.getElementById('upw').value = '';

  setTimeout(() => { umsg.innerText = ''; }, 3000);
  renderUserList();
}

// --- [구성원 목록 화면 갱신 엔진] ---
function renderUserList() {
  const ulist = document.getElementById('ulist');
  if (!ulist) return;
  
  if (d.users.length <= 1) {
    ulist.innerHTML = '<div class="empty">등록된 구성원이 없습니다.</div>';
    return;
  }

  let html = '';
  d.users.forEach(u => {
    if(u.id === 'u1') return; // 기본 관리자 계정은 목록에서 숨김 처리
    html += `
      <div class="user-row">
        <div class="user-info-box">
          <div class="avatar">${u.name.substring(0,2)}</div>
          <div>
            <div style="font-weight:600">${u.name} <span class="hint" style="margin-left:4px">${u.dept}</span></div>
            <div class="hint">${u.email}</div>
          </div>
        </div>
        <div>
          <span class="badge bp">비밀번호: ${u.pw}</span>
        </div>
      </div>
    `;
  });
  ulist.innerHTML = html;
}

// 웹 앱 첫 실행 시 기본 리스트업 작동
window.onload = function() {
  renderUserList();
};
</script>
</body>
</html>
